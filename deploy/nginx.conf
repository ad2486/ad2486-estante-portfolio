# Astro static build served from /var/www/estante (rsync'd by .github/workflows/deploy.yml).
# Rate-limit zones and Cloudflare real_ip live in the portfolio repo's deploy/limits.conf (shared by both sites).
# Depois de ativar, `sudo certbot --nginx -d estante.arthur-duarte-portfolio.com.br`.

server {
    listen 80;
    listen [::]:80;
    server_name estante.arthur-duarte-portfolio.com.br;

    root /var/www/estante;
    index index.html;

    limit_req  zone=req_ip burst=50 nodelay;
    limit_conn conn_ip 20;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml text/yaml;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Painel do CMS: fora do indice de busca.
    location /admin/ {
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ =404;
    }

    # Assets com hash no nome: cache longo.
    # add_header aqui substitui os do server, por isso os de seguranca se repetem.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
